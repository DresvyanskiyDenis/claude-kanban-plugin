<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kanban</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/board.css">
<link rel="stylesheet" href="/theme.css">
<script src="/board.js" defer></script>
</head>
<body>
<a class="skip" href="#lanes">Skip to the board</a>
<header id="top" hidden>
  <div class="bar">
    <h1 class="brand">Kanban</h1>
    <label class="pick"><span class="sr">Board</span><select id="board"></select></label>
    <label class="search"><span class="sr">Filter</span><input id="filter" type="search" placeholder="Filter by title, id or role" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
    <label class="switch"><input id="archived" type="checkbox" role="switch"> Archived</label>
    <div class="end">
      <button id="pause" type="button"></button>
      <button id="new" type="button" class="primary">New card</button>
    </div>
  </div>
  <p id="stats" class="stats"></p>
  <div id="notices"></div>
</header>
<main id="lanes" hidden></main>
<section id="gate" class="gate" aria-live="polite">
  <h1 class="brand">Kanban</h1>
  <p id="gate-text">Signing in.</p>
</section>
<dialog id="drawer" aria-labelledby="drawer-title"></dialog>
<dialog id="ask" aria-labelledby="ask-title">
  <form method="dialog">
    <h2 id="ask-title"></h2>
    <label id="ask-reason-row">Reason <textarea id="ask-reason" rows="3"></textarea></label>
    <label id="ask-confirm-row" class="check"><input id="ask-confirm" type="checkbox"> <span id="ask-confirm-text"></span></label>
    <div class="actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary">Confirm</button>
    </div>
  </form>
</dialog>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
